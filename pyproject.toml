[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcif-assistant"
version = "0.1.0"
description = "MIT DCIF deterministic retrieval MVP with an Azure Foundry-backed chat demo"
requires-python = ">=3.12"
dependencies = [
  "azure-identity>=1.19,<2",
  "beautifulsoup4>=4.12,<5",
  "chromadb>=0.5,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.9,<3",
  "posthog>=3,<4",
  "pymupdf>=1.24,<2",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
dcif = "backend.cli:app"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
